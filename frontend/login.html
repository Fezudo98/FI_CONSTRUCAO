<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — F.I Construção</title><link rel="stylesheet" href="/static/css/app.css"></head>
<body><main class="login-page"><section class="login-panel" aria-labelledby="login-title"><div class="login-card">
<div class="login-brand"><img src="/static/img/logo.jpg" alt=""><div><strong>F.I Construção</strong><small>Gestão do depósito</small></div></div>
<h1 id="login-title">Acesse sua operação</h1><p>Entre para continuar vendas, estoque e entregas.</p>
<div id="alert" class="alert err" role="alert" hidden></div><form id="login-form">
<div class="field"><label for="email">E-mail</label><input type="email" id="email" required autofocus autocomplete="username"></div>
<div class="field"><label for="password">Senha</label><input type="password" id="password" required autocomplete="current-password"></div>
<button type="submit" class="primary btn-block">Entrar</button></form></div></section>
<aside class="login-visual" aria-hidden="true"><div class="login-visual-copy"><div class="login-signal"></div><h2>O depósito inteiro, no ritmo do balcão.</h2><p>Vendas, materiais e entregas conectados em uma operação clara.</p></div></aside></main>
<script>document.getElementById('login-form').addEventListener('submit',async(e)=>{e.preventDefault();const a=document.getElementById('alert'),b=e.currentTarget.querySelector('button');a.hidden=true;b.disabled=true;b.textContent='Entrando…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok){a.textContent=d.error||'Confira seus dados e tente novamente.';a.hidden=false;return}location.href='/index.html'}catch(_){a.textContent='Servidor indisponível. Verifique a conexão e tente novamente.';a.hidden=false}finally{b.disabled=false;b.textContent='Entrar'}});</script></body></html>
